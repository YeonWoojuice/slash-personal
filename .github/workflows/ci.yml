name: Personal M2 checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-m2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API full regression and security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # jOOQ 3.21 OSS 지원 버전. 이 서비스의 데이터는 CI 종료 때 삭제된다.
        image: postgres:18
        env:
          POSTGRES_DB: slash_ci
          POSTGRES_USER: slash
          POSTGRES_PASSWORD: local-ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slash -d slash_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Job 전용 임시 서비스다. 개발자 DB나 AWS 자격 증명을 사용하지 않는다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/slash_ci
      SPRING_DATASOURCE_USERNAME: slash
      SPRING_DATASOURCE_PASSWORD: local-ci-fixture-only
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: '6379'
      JAVA_TOOL_OPTIONS: -Dspring.test.context.cache.maxSize=4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/api/*.gradle.kts
            apps/api/gradle/wrapper/gradle-wrapper.properties
      - name: Check API, DB, WebSocket, JWT, headers and metrics
        working-directory: apps/api
        run: >-
          ./gradlew --no-daemon --max-workers=2 test bootJar

  tools:
    name: Bounded request and task tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Request tools
        run: python -m unittest discover -s observability/personal/requests -p 'test_*.py' -v
      - name: Task lifecycle
        run: python -m unittest discover -s observability/personal/task -p 'test_*.py' -v
      - name: Local login and read verification tools
        run: python -m unittest discover -s observability/personal/auth -p 'test_*.py' -v

  database:
    name: Disposable TLS PostgreSQL ${{ matrix.postgres }} fault tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    env:
      DB_TEST_SERVER_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build bounded DB test image
        run: >-
          docker build --platform linux/amd64
          -f observability/personal/db-test/Dockerfile
          -t slash-personal-db-test:preparation .
      - name: Verify against disposable local PostgreSQL
        run: python -m unittest discover -s observability/personal/db-test/tests -v

  terraform:
    name: Terraform and infrastructure boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.5.7'
      - name: Format and boundary checks
        run: |
          terraform fmt -check -recursive infra/personal
          python -m unittest discover -s infra/personal/tests -v
      - name: Validate foundation
        run: |
          terraform -chdir=infra/personal/foundation init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/personal/foundation validate -no-color
      - name: Validate experiment
        run: |
          terraform -chdir=infra/personal/experiment init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/personal/experiment validate -no-color

  prometheus:
    name: Shell-free Prometheus discovery and TSDB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the configured distroless image
        run: >-
          python observability/personal/prometheus/image.py build
          --name slash-lab --image slash-personal-prometheus:ci
      - name: Verify DNS scraping, TSDB restart and runtime boundaries
        run: >-
          python observability/personal/prometheus/verify.py
          --name slash-lab --image slash-personal-prometheus:ci
