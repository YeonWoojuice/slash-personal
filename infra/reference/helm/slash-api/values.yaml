# repository는 정적 값이다 — Terraform output(ecr_repository_urls)에서 자동으로 끌어오지
# 않는다. local/dev/prod가 계정 하나를 공유하는 동안은(§11) 안 바뀌지만, 계정 구조가
# 바뀌면(§13 TODO) 여기와 slash-nlu/slash-llm의 값도 같이 고쳐야 한다.
image:
  repository: 061039804626.dkr.ecr.ap-northeast-2.amazonaws.com/slash-api
  tag: "" # values-<env>.yaml에서 반드시 채운다 (dev/prod는 CI가 커밋 SHA로 갱신)
  pullPolicy: IfNotPresent

replicaCount: 1

autoscaling:
  # true면 HPA가 replicaCount 대신 CPU 사용률로 파드 수를 관리한다. HPA와 정적 replicaCount가
  # 동시에 Deployment.spec.replicas를 놓고 다투는 걸 막기 위해, enabled일 때는
  # deployment.yaml이 replicas 필드 자체를 렌더링하지 않는다(templates/hpa.yaml 참고).
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

serviceAccount:
  # IRSA Role ARN — environments/<env>/eks output의 값을 채운다 (§7-1, Secrets Manager 접근용)
  roleArn: ""

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: alb
  scheme: internet-facing
  host: ""
  annotations: {}

env: {}

# Spring Boot Actuator가 management.endpoint.health.probes.enabled=true(application.yml)로
# liveness/readiness를 이미 분리 노출 중 — 여기서는 연결만 한다. Flyway 마이그레이션이
# 기동 중에 도는 걸 감안해 initialDelay를 둔다.
probes:
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

externalSecrets:
  # true면 External Secrets Operator(클러스터에 별도 Helm 설치 필요 — external-secrets/README.md,
  # ArgoCD 대상 아닌 kube-system 애드온이라 karpenter/alb-controller와 같은 패턴)가 AWS Secrets
  # Manager 시크릿을 K8s Secret으로 동기화한다. 인증은 serviceAccount.roleArn(IRSA)을 그대로
  # 재사용 — SecretStore가 이 파드의 ServiceAccount 신원으로 assume한다(이슈 #23/#24).
  enabled: false
  refreshInterval: 1h
  # 항목 하나 = Secrets Manager 시크릿(JSON 가능) 필드 하나 → K8s Secret 키 하나.
  # secretKey는 아래 envSecrets에서 그대로 참조하므로 이름을 맞춰야 한다.
  data: []
  # - secretKey: DB_PASSWORD
  #   remoteRef:
  #     key: rds!db-xxxx           # Secrets Manager 시크릿 이름
  #     property: password         # JSON 필드. 시크릿 전체를 쓰려면 생략

# secretKeyRef로 주입할 env 이름 목록 — externalSecrets.data의 secretKey와 동일해야 한다.
envSecrets: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
