apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slash-api.fullname" . }}
  labels:
    {{- include "slash-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "slash-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slash-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "slash-api.fullname" . }}
      containers:
        - name: slash-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          {{- if or .Values.env .Values.envSecrets }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range .Values.envSecrets }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "slash-api.fullname" $ }}-secrets
                  key: {{ . }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
