apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slash-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LikeLionTeam4/slash-infra.git
    targetRevision: dev
    path: helm/slash-api
    helm:
      valueFiles:
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
