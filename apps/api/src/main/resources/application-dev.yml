# ---------------------------------------------------------------------------
# Dev 환경 (Dev EKS + Dev RDS)
#   DB 자격증명과 Cognito 설정은 Secrets Manager 에서 환경 변수로 주입한다.
#   저장소에 평문으로 두지 않는다. (문서 0.8, OB-02)
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT:6379}

      # 관리형 Valkey 는 AUTH 토큰과 전송 구간 암호화를 함께 켜 두었다.
      # (slash-infra modules/database/valkey.tf · docs/aws-architecture.md §7-2)
      #
      # 둘 중 하나라도 빠지면 접속이 실패하는데, 증상이 인증 오류가 아니라
      # **1분 타임아웃**으로 나타난다 — 서버가 TLS 핸드셰이크를 기다리는 동안
      # 평문 요청은 응답을 받지 못하기 때문이다. 그 타임아웃이 리스너 빈 초기화를
      # 실패시켜 앱 전체가 뜨지 못한다. (slash-infra #23)
      password: ${VALKEY_AUTH_TOKEN}
      ssl:
        enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Cognito User Pool 발급자 주소
          # 예: https://cognito-idp.ap-northeast-2.amazonaws.com/{userPoolId}
          issuer-uri: ${COGNITO_ISSUER_URI}

slash:
  auth:
    cognito:
      # 이 App Client 가 발급받은 토큰만 받아들인다.
      # 같은 User Pool 에 붙은 다른 Client 의 토큰을 걸러내는 기준이다.
      client-id: ${COGNITO_CLIENT_ID}
      # 없으면 첫 로그인에서 이메일을 구하지 못한다. 기동 시점에 실패하도록 기본값을 두지 않는다.
      user-info-uri: ${COGNITO_USER_INFO_URI}

logging:
  level:
    com.likelion.slash: INFO
