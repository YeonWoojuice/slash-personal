# ---------------------------------------------------------------------------
# 시연 환경
#   Dev 와 같은 RDS 인스턴스의 별도 데이터베이스(slash_demo)를 사용한다.
#   기능 동결(8/26) 이후 개발 중 데이터 변경이 시연에 영향을 주지 않도록 분리한다.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT:6379}

      # dev 와 같은 이유로 켠다. 자세한 설명은 application-dev.yml 을 본다. (slash-infra #23)
      #
      # 시연 환경은 아직 values 파일이 없다. 띄울 때 dev 와 같은 배선
      # (Secrets Manager → ESO → VALKEY_AUTH_TOKEN) 이 필요하다.
      password: ${VALKEY_AUTH_TOKEN}
      ssl:
        enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

slash:
  auth:
    cognito:
      client-id: ${COGNITO_CLIENT_ID}
      user-info-uri: ${COGNITO_USER_INFO_URI}

logging:
  level:
    com.likelion.slash: INFO
    root: WARN
